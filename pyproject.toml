[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "silicon-truth-bridge"
version = "0.1.0"
description = "Read-only Verdi design DB and FSDB evidence MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-STB-Personal-Research-1.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "mcp>=1.28,<2",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "psutil>=7,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.4,<2",
]

[project.scripts]
stb = "stb.cli:main"
stb-mcp = "stb.server:main"
stb-worker = "stb.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
